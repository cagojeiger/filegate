name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  version:
    name: Resolve version
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      should_release: ${{ steps.ver.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Resolve unpublished version
        id: ver
        run: |
          git fetch origin main --tags
          CURRENT_MAIN_SHA=$(git rev-parse origin/main) bash deploy/ci/resolve-release.sh

  build:
    name: Build ${{ matrix.platform }}
    needs: version
    if: needs.version.outputs.should_release == 'true'
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=filegate-release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=filegate-release-${{ matrix.arch }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  cli:
    name: CLI ${{ matrix.target }}
    needs: version
    if: needs.version.outputs.should_release == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build and verify native CLI
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          rustup target add "$TARGET"
          cargo build --locked --release -p gscli --target "$TARGET"
          binary="target/$TARGET/release/gscli"
          test "$("$binary" --version)" = "gscli $VERSION"
          "$binary" --help
          GSCLI_TEST_BINARY="$PWD/$binary" cargo test -p gscli --locked --target "$TARGET" native_release_artifact -- --ignored
          GSCLI_TEST_BINARY="$PWD/$binary" python3 -B -m unittest discover -s deploy/tests -p test_installer.py -v
          mkdir -p /tmp/cli-assets
          asset="/tmp/cli-assets/gscli-$TARGET"
          cp "$binary" "$asset"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" | cut -d ' ' -f 1 > "$asset.sha256"
          else
            shasum -a 256 "$asset" | cut -d ' ' -f 1 > "$asset.sha256"
          fi

      - name: Upload CLI
        uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target }}
          path: /tmp/cli-assets/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release
    needs: [version, build, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Recheck release commit
        run: |
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
          if git rev-parse --verify "refs/tags/${{ needs.version.outputs.tag }}" >/dev/null 2>&1; then
            echo '::error::Release tag appeared during the build; refusing to overwrite it'
            exit 1
          fi

      - name: Download CLI assets
        uses: actions/download-artifact@v8
        with:
          path: /tmp/cli-assets
          pattern: cli-*
          merge-multiple: true

      - name: Assemble CLI manifest and installer
        run: |
          python3 deploy/cli/manifest.py /tmp/cli-assets "${{ needs.version.outputs.version }}" > /tmp/cli-assets/gscli-manifest.json
          cp deploy/cli/install.sh /tmp/cli-assets/gscli-installer.sh

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          version="${{ needs.version.outputs.version }}"
          images=()
          for digest in *; do
            images+=("${REGISTRY}/${IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create \
            -t "${REGISTRY}/${IMAGE}:${version}" \
            -t "${REGISTRY}/${IMAGE}:latest" \
            "${images[@]}"

      - name: Inspect manifest
        run: |
          version="${{ needs.version.outputs.version }}"
          docker buildx imagetools inspect "${REGISTRY}/${IMAGE}:${version}"

      - name: Tag and create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.version.outputs.tag }}"
          gh release create "$tag" --target "$RELEASE_SHA" --title "$tag" \
            --generate-notes /tmp/cli-assets/*
